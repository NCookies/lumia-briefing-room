[project]
name = "lumia-briefing-room"
dynamic = ["version"]
description = "이터널 리턴 교전 클립 자동 추출기"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pystray>=0.19",
    "pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pywebview>=4.4",
    "onnxruntime>=1.17",
    "pyclipper",
    "shapely",
    "omegaconf",
    "colorlog",
    "requests",
    "httpx>=0.27",
    "tqdm",
    "pyyaml",
    "six",
]

[tool.setuptools.dynamic]
version = {attr = "lumia_briefing_room.__version__"}

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "watchfiles>=0.21",
    "jsonschema>=4.20",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: 실제 수신 서버 컨테이너(docker, ../infra)가 필요한 통합 테스트 — pytest -m integration 으로 따로 실행"]
