[project]
name = "lumia-briefing-room"
version = "0.1.0"
description = "이터널 리턴 교전 클립 자동 추출기"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pystray>=0.19",
    "pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pywebview>=4.4",
    "onnxruntime>=1.17",
    "pyclipper",
    "shapely",
    "omegaconf",
    "colorlog",
    "requests",
    "tqdm",
    "pyyaml",
    "six",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
